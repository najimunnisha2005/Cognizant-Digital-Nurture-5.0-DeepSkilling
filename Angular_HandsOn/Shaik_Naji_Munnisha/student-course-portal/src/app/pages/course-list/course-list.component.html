<h2>Course Listing</h2>

<div class="search-bar">
  <input [(ngModel)]="searchTerm" (keyup.enter)="onSearch()" placeholder="Search courses..." name="listSearch" />
  <button (click)="onSearch()">Search</button>
</div>

<p *ngIf="loading$ | async">Loading courses...</p>
<p class="error" *ngIf="error$ | async as err">{{ err }}</p>

<ng-container *ngIf="!(loading$ | async)">
  <div *ngIf="(courses$ | async)?.length; else noCourses">
    <div *ngFor="let course of courses$ | async; trackBy: trackByCourseId" (click)="openDetail(course.id)">
      <app-course-card [course]="course" (enrollRequested)="onEnroll($event)"></app-course-card>
    </div>
  </div>
  <ng-template #noCourses><p>No courses available.</p></ng-template>
</ng-container>

<p *ngIf="selectedCourseId">Selected course ID: {{ selectedCourseId }}</p>
